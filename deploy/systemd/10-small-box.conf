# 小内存机 override(742MB RAM 的开发/内网机;放到
# /etc/systemd/system/netdisk.service.d/10-small-box.conf)
#
# 为什么用 drop-in 而不是改 netdisk.service:
#   仓库里的单元写的是**通用生产基线**(MemoryMax=2G)。本机只有 742MB ——
#   这是"这台机器"的事实,不是产品的事实。混进单元里,下一次部署到大机器
#   就会莫名其妙地继承一个过小的上限;写成 drop-in,机器差异只留在机器上。
#
# 为什么不干脆不设 MemoryMax:
#   不设 = 单进程可以吃到把整机 OOM killer 唤醒,然后**乱杀**(可能杀掉 PG);
#   设了 = OOM 只杀 netdisk 并由 systemd 拉起,故障面收在一个进程里。
[Service]
# 320M:Go 服务(32 个 PG 连接 + SSE 长连接 + 流式 IO)在本机量级下的合理上限
MemoryMax=320M
MemoryHigh=256M
# 本机并发很低,连接池已在 config.yaml 里对齐(max_conns=32)
LimitNOFILE=16384
