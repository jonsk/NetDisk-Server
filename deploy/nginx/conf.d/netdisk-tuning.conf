# netdisk Nginx http 级调优(/etc/nginx/conf.d/netdisk-tuning.conf)
#
# DP-01 ③ 的 worker_connections 8192 属于 **events 块**,conf.d 覆盖不了,
# 由 deploy/nginx/apply.sh 直接改主配置(幂等);这里放 http 级的部分。

# 版本号不进响应头(少一个指纹;与 Go 侧不暴露构建细节一致)。
# ⚠ **不要在这里写 `server_tokens off;`**:Debian 13 的 stock nginx.conf 第 22 行
# 已经写了它,而 nginx 对 http 块的重复指令是**硬错误**
# (`[emerg] "server_tokens" directive is duplicate` → nginx -t 失败 → reload 不生效)。
# 需要确保它 off 的地方在 deploy/nginx/apply.sh 里(幂等:缺了才补)。

# 大文件流式:关闭对上游响应的通用缓冲开关在这里,逐 location 覆盖
proxy_buffers 8 16k;
proxy_buffer_size 32k;
proxy_busy_buffers_size 64k;

# 限流被触发时返回 429(默认 503),与 Go 侧语义一致,客户端才能正确退避
limit_req_status 429;
limit_conn_status 429;

# 日志:记录真实客户端与上游耗时(排障时这两个字段最常被问)
log_format netdisk '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'rt=$request_time urt=$upstream_response_time '
                   'xip=$http_x_real_ip cache=$upstream_cache_status';
access_log /var/log/nginx/netdisk.access.log netdisk;
