# netdisk 反代公共头(/etc/nginx/snippets/netdisk-proxy.conf)
#
# 3. 真实 IP 透传:Go 侧 server.trusted_proxies 只信 127.0.0.1/::1,
# 所以这三个头**只有**由本机 Nginx 写入时才被采信 —— 客户端自己伪造的
# X-Forwarded-For 会被 Go 忽略(否则审计与限速会拿到伪造 IP)。
#
# 为什么 $proxy_add_x_forwarded_for 而不是 $remote_addr:它保留上游链路;
# 采信哪一个由 Go 的 trusted_proxies 决定(信任边界在应用侧,不在这里)。

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebDAV 客户端会用这些方法;显式列出避免被中间的默认配置吃掉
proxy_set_header Connection        "";

# HTTP/1.1 是 SSE 与 chunked 上传的前提(1.0 下事件流会被立即结束)
proxy_http_version 1.1;

# 上游慢启动与超时:普通请求 60s 足够(REST);流式路径在各自 location 里再放宽
proxy_connect_timeout 10s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;
