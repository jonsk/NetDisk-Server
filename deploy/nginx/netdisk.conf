# ============================================================================
# netdisk Nginx 站点配置(DP-01;装到 /etc/nginx/sites-available/netdisk)
#
# 3.2 的职责清单,逐条对应到下面的指令:
#   1. **SSL 终止**            —— 443 server 块(内网自签;生产换正式证书)
#   2. **路径分流(不再托管静态资源)** —— /admin、/h5 一律 proxy_pass 到 Go
#      (ADR-4:前端产物已 embed 进二进制,前端与后端同版本交付)
#   3. **真实 IP 透传**        —— X-Real-IP / X-Forwarded-For / X-Forwarded-Proto,
#      Go 侧 server.trusted_proxies 只信 127.0.0.1
#   4. **大文件流式直通**      —— /tus、/webdav 关 proxy_request_buffering;
#      下载关 proxy_buffering(否则 Nginx 先把整个文件落盘再发,断点续传语义被破坏)
#   5. **长超时 / SSE**        —— /api/v1/events 关缓冲 + read_timeout 86400s
#   6. **安全头**              —— nosniff / frame-options / referrer-policy / CSP
#   7. **粗粒度限流**          —— limit_req 与 Go 侧按接口族的细限流构成双层
#
# 为什么这里反复强调"关缓冲":打开缓冲时,一次 5GB 上传会在 Nginx 的临时目录里
# 先落盘 5GB,**上传进度与断点续传都不再真实**;下载同理,而且大文件会撑爆磁盘。
# ============================================================================

# ---- 粗限流区(与 Go 侧 rate_limits 双层;这里挡的是"洪水",不是业务配额)----
limit_req_zone $binary_remote_addr zone=netdisk_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=netdisk_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=netdisk_webdav:10m rate=100r/s;

# ---- 大文件上传:请求体上限逐 location 设置 ----
# /tus 走 chunked PATCH(单块由客户端决定),Nginx 侧不设上限,总大小由应用层控;
# WebDAV PUT 应用层限 100MB,H5 直传同理,这里给 128m 的 Nginx 侧兜底。

# 上游:Go 单进程承载全部协议(HTTP/REST + WebDAV + TUS + 内嵌前端)
upstream netdisk_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 10.14.37.187 _;

    client_max_body_size 0;          # 逐 location 用 $netdisk_max_body 覆盖
    client_body_timeout 300s;
    keepalive_timeout 75s;

    # ---- 6. 安全头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;

    access_log /var/log/nginx/netdisk.access.log;
    error_log  /var/log/nginx/netdisk.error.log warn;

    # ---- 公共代理头(3. 真实 IP 透传)----
    include /etc/nginx/snippets/netdisk-proxy.conf;

    # ---- 2. 路径分流:/、/admin、/h5 都交给 Go(内嵌前端 + SPA 回退)----
    location / {
        proxy_pass http://netdisk_app;
    }

    # ---- 1+4. TUS 断点续传:绝不缓冲请求体 ----
    location /tus {
        proxy_pass http://netdisk_app;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 4. WebDAV:同样直通(PUT 由应用层限 100MB)----
    location /webdav {
        proxy_pass http://netdisk_app;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 128m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_req zone=netdisk_webdav burst=200 nodelay;
    }

    # ---- 3+5. SSE 变更流:关缓冲 + 24h 读超时 ----
    # 关掉 buffering 与 cache 后,事件才会**逐条**到达客户端;否则 Nginx 会攒够
    # 一个缓冲区才发,客户端看到的"实时同步"会有秒级到分钟级的随机延迟。
    location = /api/v1/events {
        proxy_pass http://netdisk_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        gzip off;
    }

    # ---- 4. 下载/详情:关缓冲,让字节直接从对象存储流到客户端 ----
    location ~ ^/api/v1/files/[^/]+/content$ {
        proxy_pass http://netdisk_app;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # ---- 7. 登录接口单独收紧(暴力破解面)----
    location = /api/v1/auth/login {
        proxy_pass http://netdisk_app;
        limit_req zone=netdisk_login burst=10 nodelay;
    }

    # ---- 7. API 其余部分粗限流 ----
    location /api/ {
        proxy_pass http://netdisk_app;
        limit_req zone=netdisk_api burst=100 nodelay;
    }

    # ---- 分享落地页 /s/* ----
    location /s/ {
        proxy_pass http://netdisk_app;
    }

    # ---- 指标:只允许内网抓取(生产应指向监控网段)----
    location /metrics {
        allow 127.0.0.1;
        allow 10.14.37.0/24;
        deny all;
        proxy_pass http://netdisk_app;
    }
}

# ---- 1. SSL 终止(内网自签证书;生产替换为正式证书并把 80 重定向到 443)----
# 证书由 deploy/nginx/apply.sh 在缺失时自签生成(仅内网使用)。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 10.14.37.187 _;

    ssl_certificate     /etc/nginx/ssl/netdisk.crt;
    ssl_certificate_key /etc/nginx/ssl/netdisk.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:netdisk_ssl:4m;
    ssl_session_timeout 1h;

    client_max_body_size 0;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    include /etc/nginx/snippets/netdisk-proxy.conf;

    location / {
        proxy_pass http://netdisk_app;
    }
    location /tus {
        proxy_pass http://netdisk_app;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /webdav {
        proxy_pass http://netdisk_app;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /api/v1/events {
        proxy_pass http://netdisk_app;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        gzip off;
    }
}
